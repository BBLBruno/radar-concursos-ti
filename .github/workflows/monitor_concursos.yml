name: Monitor de Concursos TI (Muzambinho - Raio 250km)

on:
  schedule:
    # Teste solicitado para daqui a ~20min: 19:52 BRT (22:52 UTC) de hoje
    - cron: '52 22 * * *'
    # Execução oficial: 08:25 BRT (UTC-3) = 11:25 UTC, toda Segunda, Quarta e Sexta (1, 3, 5)
    # Minuto 25 escolhido para fugir do pico de sobrecarga (:00) do GitHub Actions
    - cron: '25 11 * * 1,3,5'
  workflow_dispatch: # Permite disparar manualmente pelo painel do GitHub Actions
    inputs:
      force:
        description: 'Forçar execução ignorando bloqueio de 3 horas'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar Varredura de Editais
        env:
          OPENROUTESERVICE_API_KEY: ${{ secrets.OPENROUTESERVICE_API_KEY }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ inputs.force }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            EXTRA_ARGS="--force"
          fi
          python concursos_muzambinho.py --raio 250 --saida concursos_muzambinho_ti.json $EXTRA_ARGS

      - name: Salvar Relatório Atualizado no Repositório
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add concursos_muzambinho_ti.json
          if [ -f data/distancias_cache.json ]; then
            git add data/distancias_cache.json
          fi
          git diff --staged --quiet || (git commit -m "chore: atualização automática dos editais" && git pull --rebase origin main && git push)
